name: Build & Deploy Blog

# 一次构建，两个发布目标（都能单独开关）：
#   ① GitHub Pages 仓库 zhaozhiwei1992/zhaozhiwei1992.github.io:master
#   ② 自有服务器（ECS/NAS）的静态目录，rsync over SSH
#
# 需要的凭据（两套，互不相关，别共用）：
#   DEPLOY_KEY         Pages 仓库的写权限 deploy key（私钥）
#   SERVER_SSH_KEY     登录自有服务器的私钥
# 服务器同步默认关闭，仓库变量 ENABLE_SERVER_DEPLOY=true 才执行。
# 细节见笔记 ~/workspace/knowledge-workspace/notes/常用工具/hexo实战.org「GitHub Actions 自动部署」。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  # PR 的构建可以互相取消；push 的部署不要中途取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # package-lock 里的 resolved 指向 registry.npmjs.org，CI 直连公共源；
        # 本地 ~/.npmrc 指向内网 Nexus 时 npm 会自动替换 host（replace-registry-host 默认 npmjs）。
        run: npm ci --no-audit --no-fund

      - name: Generate site
        run: npx hexo generate

      - name: Verify output
        run: |
          set -e
          # 构建残缺时宁可不发，也别让 rsync --delete 把服务器清空
          for f in index.html 404.html robots.txt sitemap.xml atom.xml search.xml; do
            test -f "public/$f" || { echo "missing public/$f"; exit 1; }
          done
          test "$(find public -type f | wc -l)" -gt 100 || { echo "too few files"; exit 1; }
          echo "generated files: $(find public -type f | wc -l)"

      # ---------- 目标 ①：GitHub Pages ----------
      - name: Deploy to Pages repository
        # PR 只验证构建，不发布
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          # 用 PAT（fine-grained，目标仓库 contents:write）时，把上面一行换成：
          # github_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: zhaozhiwei1992/zhaozhiwei1992.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: true        # 每次单提交，Pages 仓库不会越滚越大
          enable_jekyll: false      # 生成 .nojekyll，跳过 Jekyll 处理
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "${{ github.event.head_commit.message || 'deploy: manual run' }}"

      # ---------- 目标 ②：自有服务器 ----------
      - name: Server deploy skipped notice
        if: github.event_name != 'pull_request' && vars.ENABLE_SERVER_DEPLOY != 'true'
        run: echo "::notice::ECS 同步未启用：设置仓库变量 ENABLE_SERVER_DEPLOY=true 后才会执行 rsync"

      - name: Setup SSH key for server
        if: github.event_name != 'pull_request' && vars.ENABLE_SERVER_DEPLOY == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ vars.SERVER_PORT || 22 }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            # 推荐：把服务器 host key 固定成 secret，防 MITM
            printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Rsync to server
        if: github.event_name != 'pull_request' && vars.ENABLE_SERVER_DEPLOY == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT || 22 }}
          REMOTE_PATH: ${{ vars.SERVER_PATH || '/var/www/blog/' }}
        run: |
          set -e
          # --delete 会删掉目标端多出来的文件；Verify output 已挡住空产物
          rsync -az --delete --chmod=D755,F644 --exclude '.git' \
            -e "ssh -p ${PORT} -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            public/ "${USER}@${HOST}:${REMOTE_PATH}"
